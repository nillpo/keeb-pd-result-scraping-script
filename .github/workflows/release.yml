name: Release

# v1.2.3 のようなタグを push すると、ビルドして GitHub Release に .user.js を添付する
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Release の作成に必要。このジョブだけに付与する
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 書き込み権限のトークンを .git/config に残さない（gh は GH_TOKEN を使う）
          persist-credentials: false

      - name: Verify the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify the tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi

      # pnpm のバージョンは package.json の packageManager から決まる
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node.js のバージョンは .node-version から決まる
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # ファイル名は builder.ts の fileName と同じにする（@updateURL が参照する）
        run: gh release create "$TAG" out/keeb-pd-result-scraper.user.js --generate-notes --verify-tag
