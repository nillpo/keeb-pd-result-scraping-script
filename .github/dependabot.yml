version: 2

updates:
  # package.json / pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm-workspace.yaml の minimumReleaseAge（7日）と揃える
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # .github/workflows 内のアクション（コミットSHAで固定しているため更新が必要）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
